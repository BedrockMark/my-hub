# Default manifest for my-hub

# This file is bundled into the binary at compile time.
# Users can override it by creating their own manifest.toml in:
#     %APPDATA%\my-hub\manifest.toml

# Each [[program]] entry describes one my-family application.
# Fields:
#   id          - unique identifier (slug, used in state.json)
#   name        - display name
#   owner       - GitHub owner (user or org)
#   repo        - GitHub repository name
#   executable  - binary name inside the GitHub release asset
#   description - short description (optional)
#   enabled     - whether to check for updates (default true)

# my-hub itself - the launcher app
[[program]]
id = "my-hub"
name = "my-hub"
owner = "BedrockMark"
repo = "my-hub"
executable = "my-hub.exe"
description = "Central hub for the my-family suite"
enabled = true

[[program]]
id = "my-tomato"
name = "my-tomato"
owner = "BedrockMark"
repo = "my-hub"
executable = "my-tomato.exe"
description = "Lightweighted Tomato Clock, period."
enabled = true

[[program]]
id = "my-recipe"
name = "my-recipe"
owner = "BedrockMark"
repo = "my-recipe"
executable = "my-recipe.exe"
description = "Recipe manager, more than recording, but also assist weekly preparation and monthly neutrition analysis"
enabled = true

[[program]]
id = "my-scheduler"
name = "my-scheduler"
owner = "BedrockMark"
repo = "my-scheduler"
executable = "my-scheduler.exe"
description = "Habit formation reminder, features any frequence reminder by using cron expression"
enabled = true

[[program]]
id = "my-skills"
name = "my-skills"
owner = "BedrockMark"
repo = "my-skills"
executable = "README.md"
description = "An agent skill library, contain my day-to-day used agent skills, that are made by myself"
enabled = true

[[program]]
id = "my-resume"
name = "my-resume"
owner = "BedrockMark"
repo = "my-resume"
executable = "main.pdf"
description = "My resume!"
enabled = false
