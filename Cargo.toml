[package]
name = "my-hub"
version = "0.1.0"
edition = "2021"
description = "A central hub for managing the my-family suite of applications"
authors = ["my-hub contributors"]
repository = "https://github.com/BedrockMark/my-hub"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
# GUI
slint = { version = "1.x", default-features = false, features = [
    "std", 
    "compat-1-2",
    "backend-winit",      # 使用 winit 管理窗口
    # "renderer-femtovg"    # 使用 FemtoVG 渲染（比 Skia 更轻量，兼容性有时更好）
    "renderer-software" # 如果你想完全不依赖 GPU，选这个
] }

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Version comparison
semver = { version = "1", features = ["serde"] }

# Platform paths
dirs = "5"

# Open files with the OS default application (native launch)
opener = "0.7"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# MSI 打包引擎（由 installer feature 启用，cargo-packager 库 API）
cargo-packager = { version = "0.11", optional = true, default-features = false, features = ["rustls-tls"] }

# MSI installer builder
[[bin]]
name = "build-installer"
path = "src/bin/build_installer.rs"
required-features = ["installer"]

# Build dependencies
[build-dependencies]
slint-build = "1.x"

[features]
default = []
# 打包 MSI 安装器（仅 build-installer 使用；不启用时不影响日常构建）
installer = ["dep:cargo-packager"]
# Future: self-update could be a feature flag

# Optimize release builds
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
