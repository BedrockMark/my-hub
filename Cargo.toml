[package]
name = "my-hub"
version = "0.1.0"
edition = "2021"
description = "A central hub for managing the my-family suite of applications"
authors = ["my-hub contributors"]
repository = "https://github.com/yourusername/my-hub"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
# GUI
slint = "1.12"

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Version comparison
semver = { version = "1", features = ["serde"] }

# Platform paths
dirs = "5"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Windows-specific
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
msi = "0.10"
uuid = { version = "1", features = ["v4"] }

# MSI installer builder
[[bin]]
name = "build-installer"
path = "src/bin/build_installer.rs"
required-features = []

# Build dependencies
[build-dependencies]
slint-build = "1.12"

[features]
default = []
# Future: self-update could be a feature flag

# Optimize release builds
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1